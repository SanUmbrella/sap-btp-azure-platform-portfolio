apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-probe-api
  namespace: platform-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aks-probe-api
  template:
    metadata:
      labels:
        app: aks-probe-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: kv-reader
      containers:
        - name: aks-probe-api
          image: "${IMAGE}"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KEYVAULT_URL
              value: "${KEYVAULT_URL}"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: Service
metadata:
  name: aks-probe-api
  namespace: platform-lab
spec:
  type: ClusterIP
  selector:
    app: aks-probe-api
  ports:
    - name: http
      port: 80
      targetPort: http
