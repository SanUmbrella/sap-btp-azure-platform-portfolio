<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 560">
  <title id="title">SAP BTP and Azure platform architecture</title>
  <desc id="desc">Sanitized architecture diagram showing SAP BTP, Cloudflare Tunnel, AKS Workload Identity and Azure Key Vault.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .zone { fill: #ffffff; stroke: #ccd3dd; stroke-width: 2; }
      .sap { fill: #e8f3ff; stroke: #3978b8; }
      .azure { fill: #eef8f2; stroke: #43845a; }
      .identity { fill: #fff4dc; stroke: #b07a1f; }
      .connect { fill: #f1edf9; stroke: #7356a8; }
      .node { fill: #ffffff; stroke: #65758b; stroke-width: 1.5; }
      .label { font: 600 18px Arial, sans-serif; fill: #1f2937; }
      .small { font: 14px Arial, sans-serif; fill: #334155; }
      .tiny { font: 12px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>

  <rect class="bg" width="1200" height="560" rx="0" />

  <rect class="zone sap" x="150" y="80" width="310" height="360" rx="8" />
  <text class="label" x="180" y="118">SAP BTP</text>
  <text class="tiny" x="180" y="140">Cloud Foundry application boundary</text>

  <rect class="zone connect" x="500" y="80" width="220" height="360" rx="8" />
  <text class="label" x="528" y="118">Connectivity</text>
  <text class="tiny" x="528" y="140">HTTPS edge and outbound tunnel</text>

  <rect class="zone azure" x="760" y="80" width="300" height="360" rx="8" />
  <text class="label" x="790" y="118">Microsoft Azure</text>
  <text class="tiny" x="790" y="140">AKS workload and Key Vault access</text>

  <rect class="node" x="40" y="230" width="80" height="52" rx="8" />
  <text class="small" x="64" y="261">User</text>

  <rect class="node" x="185" y="178" width="230" height="46" rx="7" />
  <text class="small" x="254" y="206">AppRouter</text>

  <rect class="node" x="185" y="242" width="230" height="46" rx="7" />
  <text class="small" x="268" y="270">XSUAA</text>

  <rect class="node" x="185" y="306" width="230" height="46" rx="7" />
  <text class="small" x="242" y="334">BTP Backend</text>

  <rect class="node" x="185" y="370" width="230" height="46" rx="7" />
  <text class="small" x="238" y="398">Destination Service</text>

  <rect class="node" x="535" y="200" width="150" height="52" rx="7" />
  <text class="small" x="571" y="231">HTTPS Edge</text>

  <rect class="node" x="535" y="304" width="150" height="52" rx="7" />
  <text class="small" x="558" y="335">Cloudflare Tunnel</text>

  <rect class="node" x="790" y="178" width="220" height="46" rx="7" />
  <text class="small" x="840" y="206">cloudflared x2</text>

  <rect class="node" x="790" y="242" width="220" height="46" rx="7" />
  <text class="small" x="840" y="270">ClusterIP Service</text>

  <rect class="node" x="790" y="306" width="220" height="46" rx="7" />
  <text class="small" x="852" y="334">Probe API</text>

  <rect class="node identity" x="790" y="370" width="220" height="46" rx="7" />
  <text class="small" x="824" y="398">Workload Identity</text>

  <rect class="node identity" x="1080" y="180" width="90" height="46" rx="7" />
  <text class="small" x="1100" y="208">Entra ID</text>

  <rect class="node identity" x="1080" y="306" width="90" height="46" rx="7" />
  <text class="small" x="1100" y="334">Key Vault</text>

  <path class="arrow" d="M 120 256 L 185 201" />
  <path class="arrow" d="M 300 224 L 300 242" />
  <path class="arrow" d="M 300 288 L 300 306" />
  <path class="arrow" d="M 300 352 L 300 370" />
  <path class="arrow" d="M 415 393 C 470 393 480 226 535 226" />
  <path class="arrow" d="M 685 226 C 728 226 742 201 790 201" />
  <path class="arrow" d="M 685 330 L 790 330" />
  <path class="arrow dash" d="M 900 224 L 900 242" />
  <path class="arrow" d="M 900 288 L 900 306" />
  <path class="arrow" d="M 900 352 L 900 370" />
  <path class="arrow" d="M 1010 393 C 1055 393 1055 203 1080 203" />
  <path class="arrow" d="M 1125 226 L 1125 306" />

  <text class="tiny" x="530" y="468">Application inbound: BTP -> HTTPS edge -> tunnel -> internal AKS service</text>
  <text class="tiny" x="530" y="490">Identity: ServiceAccount -> OIDC token -> Entra exchange -> managed identity -> Key Vault RBAC</text>
</svg>
