name: Validate public repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.0"
          terraform_wrapper: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: reference-implementation/azure/probe-api/go.mod
          cache-dependency-path: reference-implementation/azure/probe-api/go.sum

      - name: Run public repository safety checks
        run: python3 scripts/validate_public_repo.py

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate Terraform modules
        run: scripts/validate_terraform.sh

      - name: Test Go probe API
        working-directory: reference-implementation/azure/probe-api
        run: go test ./...

      - name: Check whitespace
        run: git diff --check
