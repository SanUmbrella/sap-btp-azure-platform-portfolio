# Representative sanitized pattern, not a complete deployable environment.
# The real deployment dynamically rendered AZURE_CLIENT_ID from Terraform output
# after rebuild and checked it against the managed identity output.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aks-probe-api
  namespace: platform-lab
  annotations:
    azure.workload.identity/client-id: "${AZURE_CLIENT_ID}"
